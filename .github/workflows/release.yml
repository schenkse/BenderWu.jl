name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Verify tag and project versions agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          julia --project=. -e
          'using TOML; tag = ENV["RELEASE_TAG"];
          version = TOML.parsefile("Project.toml")["version"];
          tag == "v" * version || error("Tag $tag does not match project version $version")'

      - name: Locate the release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES=".github/release-notes/${RELEASE_TAG}.md"
          test -s "$NOTES"
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "BenderWu $RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES"
